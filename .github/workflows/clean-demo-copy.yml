name: Clean demo descriptions
on:
  push:
    branches: [docs/continuous-preview-v3]
    paths: [.github/workflows/clean-demo-copy.yml]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Keep only the feature description and video link
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          entries={'README.md':('Demo','Watch video','Read a PDF, ask a question, follow up, and revisit the conversation.'),'README_ZH.md':('演示','观看视频','阅读 PDF，向 AI 提问、继续追问，再回看问答。'),'README_JA.md':('デモ','動画を見る','PDF を読みながら AI に質問し、追加の質問や回答の振り返りができます。')}
          pattern=r'<!-- project-demo-v1 -->.*?<!-- /project-demo-v1 -->'
          for name,(heading,watch,copy) in entries.items():
              p=Path(name);text=p.read_text();assert len(re.findall(pattern,text,re.S))==1
              block=f'<!-- project-demo-v1 -->\n## {heading}\n\n[![Satori](docs/demos/preview.gif)](docs/demos/demo.mp4)\n\n[{watch}](docs/demos/demo.mp4)\n\n{copy}\n<!-- /project-demo-v1 -->'
              p.write_text(re.sub(pattern,lambda _:block,text,flags=re.S))
          p=Path('docs/status.md');p.write_text(p.read_text()+'\n\n### 2026-09-06 · 精简演示说明\n\nREADME 演示区仅保留功能介绍与视频入口，移除制作说明。应用行为未改变。\n')
          PY
          git add -- README.md README_ZH.md README_JA.md docs/status.md
          git rm -- .github/workflows/clean-demo-copy.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: keep demo descriptions focused on features'
          git push origin HEAD:refs/heads/docs/continuous-preview-v3
