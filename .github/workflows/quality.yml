name: Quality checks

"on":
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'index.html'
      - 'rust-toolchain*'
      - '.cargo/**'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'index.html'
      - 'rust-toolchain*'
      - '.cargo/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Frontend and macOS Rust
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Identify Rust cache
        id: rust-version
        run: echo "hash=$(rustc --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            src-tauri/target
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.hash }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      # Tauri embeds dist, so build the frontend before every Rust check.
      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check release Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --release

      - name: Lint release Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --release -- -D warnings

      - name: Check development shell
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features dev-live
