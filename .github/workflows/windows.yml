name: Windows packages

"on":
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nsis:
    name: NSIS (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-2025
            runner_arch: X64
            target: x86_64-pc-windows-msvc
            pe_machine: "8664"
            installer_arch: x64
          - name: arm64
            runner: windows-11-arm
            runner_arch: ARM64
            target: aarch64-pc-windows-msvc
            pe_machine: "AA64"
            installer_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Confirm runner architecture
        shell: pwsh
        run: |
          if ("${{ runner.arch }}" -ne "${{ matrix.runner_arch }}") {
            throw "Expected runner architecture ${{ matrix.runner_arch }}, got ${{ runner.arch }}."
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Check release Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }}

      - name: Lint release Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }} -- -D warnings

      - name: Build unsigned NSIS package and signed updater artifact
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          .\node_modules\.bin\tauri.cmd build
          --config src-tauri/tauri.windows.conf.json
          --target ${{ matrix.target }}
          --bundles nsis
          --ci
          --no-sign
          -- --locked

      - name: Verify executable architecture and installer
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-PeMachine([string] $Path) {
            $reader = $null
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) {
                throw "Executable has no DOS header: $Path"
              }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Executable has no PE header: $Path"
              }
              return $reader.ReadUInt16()
            } finally {
              if ($null -ne $reader) { $reader.Dispose() }
              $stream.Dispose()
            }
          }

          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($config.productName -cne "Satori" -or $config.app.windows[0].title -cne "Satori") {
            throw "Windows product and window title must both be exactly Satori."
          }
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\${{ matrix.target }}\release"
          $appExe = Join-Path $releaseRoot "satori.exe"
          $installer = Join-Path $releaseRoot "bundle\nsis\Satori_$($config.version)_${{ matrix.installer_arch }}-setup.exe"
          $updaterSignature = "$installer.sig"

          if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) {
            throw "Missing application executable: $appExe"
          }

          $nsisDirectory = Split-Path -Parent $installer
          $installers = @(Get-ChildItem -LiteralPath $nsisDirectory -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer in $nsisDirectory; found $($installers.Count)."
          }
          $expectedInstallerName = [System.IO.Path]::GetFileName($installer)
          if ($installers[0].Name -cne $expectedInstallerName) {
            throw "Unexpected NSIS installer: $($installers[0].Name); expected $expectedInstallerName."
          }
          $signatures = @(Get-ChildItem -LiteralPath $nsisDirectory -Filter "*.sig" -File)
          if ($signatures.Count -ne 1 -or $signatures[0].FullName -cne $updaterSignature) {
            throw "Expected exactly one updater signature named $([System.IO.Path]::GetFileName($updaterSignature))."
          }
          $signatureText = (Get-Content -LiteralPath $updaterSignature -Raw).Trim()
          if ($signatureText.Length -lt 32 -or $signatureText -notmatch '^[A-Za-z0-9+/=\r\n]+$') {
            throw "Updater signature is empty or malformed."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "satori-nsis-${{ matrix.name }}"
          & 7z x -y "-o$extractRoot" $installer | Out-Host
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip could not inspect the NSIS payload."
          }
          $payloadExecutables = @(Get-ChildItem -LiteralPath $extractRoot -Recurse -Filter "satori.exe" -File)
          if ($payloadExecutables.Count -ne 1) {
            throw "Expected exactly one satori.exe inside the NSIS installer; found $($payloadExecutables.Count)."
          }

          # The ARM64 NSIS launcher is x86 by design, so verify the bundled app payload.
          $expectedMachine = [Convert]::ToUInt16("${{ matrix.pe_machine }}", 16)
          $builtMachine = Get-PeMachine $appExe
          $payloadMachine = Get-PeMachine $payloadExecutables[0].FullName
          if ($builtMachine -ne $expectedMachine -or $payloadMachine -ne $expectedMachine) {
            throw ("Wrong PE machine: expected 0x{0:X4}, built 0x{1:X4}, installer payload 0x{2:X4}." -f $expectedMachine, $builtMachine, $payloadMachine)
          }

          $builtHash = (Get-FileHash -LiteralPath $appExe -Algorithm SHA256).Hash
          $payloadHash = (Get-FileHash -LiteralPath $payloadExecutables[0].FullName -Algorithm SHA256).Hash
          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          $signatureHash = (Get-FileHash -LiteralPath $updaterSignature -Algorithm SHA256).Hash
          $hashManifest = Join-Path $nsisDirectory "Satori_$($config.version)_${{ matrix.installer_arch }}-SHA256SUMS.txt"
          @(
            "$installerHash  $([System.IO.Path]::GetFileName($installer))"
            "$signatureHash  $([System.IO.Path]::GetFileName($updaterSignature))"
            "$builtHash  satori.exe.pre-bundle"
            "$payloadHash  satori.exe.nsis-payload"
          ) | Set-Content -LiteralPath $hashManifest -Encoding utf8

          "Verified $appExe as PE machine 0x$($builtMachine.ToString('X4'))."
          "Verified the exact installer and its PE payload: $installer."
          "Recorded separate pre-bundle, NSIS payload, and installer SHA-256 values in $hashManifest."
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "signature=$updaterSignature" >> $env:GITHUB_OUTPUT
          "manifest=$hashManifest" >> $env:GITHUB_OUTPUT

      - name: Verify current-user install and uninstall lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "${{ steps.verify.outputs.installer }}"
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "Silent current-user install failed with exit code $($install.ExitCode)."
          }

          $uninstallKey = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
            Where-Object { $_.DisplayName -ceq "Satori" } |
            Select-Object -First 1
          if ($null -eq $uninstallKey) {
            throw "The current-user uninstall entry is not named Satori."
          }

          $installLocation = ([string] $uninstallKey.InstallLocation).Trim('"')
          $installedExe = @(
            Get-ChildItem -LiteralPath $installLocation -Recurse -Filter "satori.exe" |
              Where-Object { -not $_.PSIsContainer }
          )
          if ($installedExe.Count -ne 1) {
            throw "Expected one installed satori.exe; found $($installedExe.Count)."
          }
          $installedExePath = $installedExe[0].FullName
          $versionInfo = $installedExe[0].VersionInfo
          if ($versionInfo.ProductName -cne "Satori" -or $versionInfo.FileDescription -cne "Satori") {
            throw "Installed executable metadata is not consistently named Satori."
          }

          $startMenuRoot = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $startLinks = @(
            Get-ChildItem -LiteralPath $startMenuRoot -Recurse -Filter "Satori.lnk" |
              Where-Object { -not $_.PSIsContainer }
          )
          if ($startLinks.Count -ne 1) {
            throw "Expected one Start menu shortcut named Satori; found $($startLinks.Count)."
          }
          $startShortcutPath = $startLinks[0].FullName
          $desktopRoot = [Environment]::GetFolderPath("Desktop")
          $desktopLinks = @(
            Get-ChildItem -LiteralPath $desktopRoot -Filter "Satori.lnk" |
              Where-Object { -not $_.PSIsContainer }
          )
          if ($desktopLinks.Count -ne 1) {
            throw "Expected one desktop shortcut named Satori; found $($desktopLinks.Count)."
          }
          $desktopShortcutPath = $desktopLinks[0].FullName

          $shell = New-Object -ComObject WScript.Shell
          foreach ($linkPath in @($startLinks[0].FullName, $desktopLinks[0].FullName)) {
            $shortcut = $shell.CreateShortcut($linkPath)
            if ([System.IO.Path]::GetFullPath($shortcut.TargetPath) -ne $installedExe[0].FullName) {
              throw "Shortcut does not target the installed Satori executable: $linkPath"
            }
          }

          $uninstallCommand = [string]$uninstallKey.UninstallString
          $uninstaller = if ($uninstallCommand.StartsWith('"')) {
            [regex]::Match($uninstallCommand, '^"([^"]+)"').Groups[1].Value
          } else {
            $uninstallCommand.Split(' ')[0]
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent uninstall failed with exit code $($uninstall.ExitCode)."
          }

          # An exit code alone does not prove that the current-user install was
          # removed. Give the NSIS cleanup process a bounded interval, then
          # require every identity surface and the install directory to be gone.
          $uninstallDeadline = (Get-Date).AddSeconds(15)
          do {
            $remainingUninstallEntries = @(
              Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -ceq "Satori" }
            )
            $applicationRemains = Test-Path -LiteralPath $installedExePath -PathType Leaf
            $installDirectoryRemains = Test-Path -LiteralPath $installLocation
            $startShortcutRemains = Test-Path -LiteralPath $startShortcutPath -PathType Leaf
            $desktopShortcutRemains = Test-Path -LiteralPath $desktopShortcutPath -PathType Leaf
            $uninstallComplete =
              $remainingUninstallEntries.Count -eq 0 -and
              -not $applicationRemains -and
              -not $installDirectoryRemains -and
              -not $startShortcutRemains -and
              -not $desktopShortcutRemains
            if (-not $uninstallComplete) {
              Start-Sleep -Milliseconds 250
            }
          } while (-not $uninstallComplete -and (Get-Date) -lt $uninstallDeadline)

          if (-not $uninstallComplete) {
            throw "Uninstall left application, install-directory, registry, Start menu, or desktop residue."
          }
          "Verified current-user install identity and complete uninstall cleanup for Satori."

      - name: Upload unsigned NSIS package and updater signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satori-windows-${{ matrix.name }}-nsis
          path: |
            ${{ steps.verify.outputs.installer }}
            ${{ steps.verify.outputs.signature }}
            ${{ steps.verify.outputs.manifest }}
          if-no-files-found: error
          retention-days: 14
