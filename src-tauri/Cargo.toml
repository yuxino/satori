[package]
name = "satori"
version = "3.3.1"
description = "Satori — a local-first PDF learning workspace"
edition = "2021"

[features]
dev-live = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "custom-protocol", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
keyring = { version = "3", features = ["apple-native"] }
security-framework = "3.7"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
urlencoding = "2"
zeroize = "1"
fs2 = "0.4"

[profile.release]
strip = true
lto = true
